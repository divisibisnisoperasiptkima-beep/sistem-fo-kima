[package]
name = "fo-kima-backend"
version = "0.1.0"
edition = "2024"
default-run = "fo-kima-backend"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
argon2 = "0.5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "alloc"] }
dotenvy = "0.15"
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "mysql"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["cors", "trace", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
urlencoding = "2"
